spring.application.name=bff-web
spring.config.import=optional:configserver:http://localhost:8888

# Base de datos H2 en memoria: agregada para la persistencia de Transaccion
# de la saga (Exp3 S7). El resto del proyecto sigue en memoria (CuentaRepository).
spring.datasource.url=jdbc:h2:mem:bffweb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Saga de transferencia con JMS (ActiveMQ Artemis embebido, Exp3 S7)
spring.artemis.mode=embedded
spring.artemis.embedded.enabled=true
spring.artemis.embedded.queues=queue.transferencia.iniciada,queue.debito.realizado,queue.transferencia.fallida,queue.transferencia.completada,queue.transferencia.compensacion,queue.transferencia.revertida

# Para que se vea en las capturas de evidencia con mas detalle
logging.level.com.duoc.bancoxyzbff.transferencia=DEBUG
