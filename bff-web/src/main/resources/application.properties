spring.application.name=bff-web
spring.config.import=optional:configserver:http://localhost:8888

# Base de datos H2 en memoria: agregada para la persistencia de Transaccion
# de la saga (Exp3 S7). El resto del proyecto sigue en memoria (CuentaRepository).
spring.datasource.url=jdbc:h2:mem:bffweb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Saga de transferencia con JMS (ActiveMQ Artemis embebido, Exp3 S7)
spring.artemis.mode=embedded
spring.artemis.embedded.enabled=true
spring.artemis.embedded.queues=queue.transferencia.iniciada,queue.debito.realizado,queue.transferencia.fallida,queue.transferencia.completada,queue.transferencia.compensacion,queue.transferencia.revertida

# Para que se vea en las capturas de evidencia con mas detalle
logging.level.com.duoc.bancoxyzbff.transferencia=DEBUG

# Token del canal (client_credentials) que este BFF manda a cuentas y clientes
spring.security.oauth2.client.registration.canal.provider=auth-server
spring.security.oauth2.client.registration.canal.client-id=cliente-web
spring.security.oauth2.client.registration.canal.client-secret=WEB-KEY-2024
spring.security.oauth2.client.registration.canal.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.canal.scope=web
spring.security.oauth2.client.provider.auth-server.token-uri=http://localhost:9000/oauth2/token

# Circuit Breaker de las llamadas a cuentas y a clientes. Un 4xx es una
# respuesta valida del servicio y no cuenta como fallo.
resilience4j.circuitbreaker.configs.default.sliding-window-size=5
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=3
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.ignore-exceptions=org.springframework.web.client.HttpClientErrorException
resilience4j.circuitbreaker.instances.cuentas.base-config=default
resilience4j.circuitbreaker.instances.clientes.base-config=default
