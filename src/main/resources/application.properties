spring.application.name=banco-xyz-bff
server.port=8443

# HTTPS con certificado autofirmado (Exp2 S5)
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore/bff-keystore.p12
server.ssl.key-store-password=bancoxyz2024
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bff-banco-xyz

# Llaves de canal, usadas por TokenController para emitir el JWT correspondiente
# (POST /api/auth/token). Ya no viajan en cada request como en S4.
canal.web.llave=WEB-KEY-2024
canal.movil.llave=MOVIL-KEY-2024
canal.cajero.llave=CAJERO-KEY-2024

# Configuracion del JWT emitido por /api/auth/token y validado por CanalAuthInterceptor
jwt.secreto=una-llave-secreta-de-al-menos-32-caracteres-para-hmac-sha256-bancoxyz
jwt.expiracion-minutos=15
