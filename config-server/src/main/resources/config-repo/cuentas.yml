server:
  port: 8084

spring:
  kafka:
    consumer:
      group-id: cuentas-saga
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        "[spring.json.value.default.type]": com.duoc.cuentas.saga.evento.EventoTransferencia
        "[spring.json.use.type.headers]": false
        "[spring.json.trusted.packages]": com.duoc.cuentas.saga.evento
    listener:
      # una hebra por particion de cada topic (3 particiones)
      concurrency: 3

# Id unico por replica en Eureka (para escalar con docker compose --scale).
# HOSTNAME es el id del contenedor; fuera de Docker se usa un valor aleatorio.
eureka:
  instance:
    instance-id: ${spring.application.name}:${HOSTNAME:${random.value}}
