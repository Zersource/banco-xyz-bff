# Configuracion extra para cuando los servicios corren en Docker
# (perfil "docker"). Dentro de la red de compose, Eureka se alcanza
# por el nombre de su servicio y no por localhost.

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://auth-server:9000/oauth2/jwks
      client:
        provider:
          auth-server:
            token-uri: http://auth-server:9000/oauth2/token
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
