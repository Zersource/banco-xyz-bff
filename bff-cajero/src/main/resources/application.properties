spring.application.name=bff-cajero
spring.config.import=optional:configserver:http://localhost:8888

# Token del canal (client_credentials) que este BFF manda a cuentas
spring.security.oauth2.client.registration.canal.provider=auth-server
spring.security.oauth2.client.registration.canal.client-id=cliente-cajero
spring.security.oauth2.client.registration.canal.client-secret=CAJERO-KEY-2024
spring.security.oauth2.client.registration.canal.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.canal.scope=cajero
spring.security.oauth2.client.provider.auth-server.token-uri=http://localhost:9000/oauth2/token

# Circuit Breaker de las llamadas a cuentas. Un 4xx (404/400) es una respuesta
# valida de cuentas y no cuenta como fallo.
resilience4j.circuitbreaker.instances.cuentas.sliding-window-size=5
resilience4j.circuitbreaker.instances.cuentas.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.cuentas.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.cuentas.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.cuentas.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.cuentas.ignore-exceptions=org.springframework.web.client.HttpClientErrorException
