# Balanceador local para la prueba de escala de bff-web (sustituto del ALB de AWS).
# "bff-web" lo resuelve el DNS interno de Docker a la IP de CADA replica; nginx lo resuelve
# al arrancar, por eso se levanta despues de escalar (ver docker-compose.escala-bff.yaml).
# upstream_addr en el log: a que replica fue cada request
log_format escala '$remote_addr [$time_local] "$request" $status upstream=$upstream_addr';

upstream bff_web {
    # zone: el estado del round-robin se comparte entre los workers de nginx (worker_processes
    # auto). Sin esto cada worker lleva su propio turno y, con pocas conexiones nuevas, todas
    # caen en la misma replica (lo que se vio en la primera medicion: 10/0).
    zone bff_web 64k;
    server bff-web:8081;    # una entrada por cada IP que devuelva el DNS -> round-robin
}

server {
    listen 80;
    access_log /dev/stdout escala;

    location / {
        proxy_pass http://bff_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }
}
