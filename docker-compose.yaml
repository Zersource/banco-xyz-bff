services:
  eureka-server:
    build: ./eureka-server
    ports:
      - "8761:8761"
    environment:
      - EUREKA_INSTANCE_HOSTNAME=eureka-server
      - JAVA_TOOL_OPTIONS=-Xmx256m
    restart: unless-stopped

  config-server:
    build: ./config-server
    ports:
      - "8888:8888"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx256m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  bff-web:
    build: ./bff-web
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - JAVA_TOOL_OPTIONS=-Xmx256m
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_started
    restart: unless-stopped

  bff-movil:
    build: ./bff-movil
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - JAVA_TOOL_OPTIONS=-Xmx256m
      - LOGGING_LEVEL_IO_GITHUB_RESILIENCE4J_CIRCUITBREAKER=DEBUG
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_started
    restart: unless-stopped

  bff-cajero:
    build: ./bff-cajero
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - JAVA_TOOL_OPTIONS=-Xmx256m
      - LOGGING_LEVEL_IO_GITHUB_RESILIENCE4J_CIRCUITBREAKER=DEBUG
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_started
    restart: unless-stopped
